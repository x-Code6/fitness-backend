# 社区服务配置
# 中间件地址、账号、口令与密钥全部由环境变量注入，本文件不留任何默认值。
# 变量清单见项目根目录 .env.example；本地开发复制成 .env 即可，.env 不入库。
server:
  port: 8105

spring:
  # 环境相关配置（地址 / 账号 / 口令 / 密钥）一律由环境变量注入，本文件不留任何默认值。
  # 取值清单与说明见项目根目录 .env.example；本地开发把 .env.example 复制成 .env 即可。
  # 两种启动方式都能读到：IDEA 里工作目录是模块根目录（走 ../.env），
  # 在项目根目录跑 fat-jar 时走 ./.env。
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: fitness-community
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/yd_community?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASS}
  # Kafka：只作为<b>生产者</b>，而且只发一种事件（post_view）到 behavior 那条 topic。
  # ★不新开 topic、不在这里配 consumer：浏览明细的落库由 fitness-behavior 的消费者负责，
  #   计数本身走 Redis，Kafka 在这里只承担"留原始数据、可重算"这一件事。
  kafka:
    bootstrap-servers: ${KAFKA_ADDR}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

community:
  # 浏览量刷库间隔（PostViewFlushTask 的 fixedDelay）。
  # 它同时是"Redis 里最多滞留多久的未入账增量"——Redis 挂掉时会丢的就是这一段。
  # 调小 = 少丢数据但 DB 敲得更勤，30 秒是"体感滞后可接受 + 空闲时几乎不打 DB"的折中。
  view-flush-delay-ms: 30000

logging:
  # ★联调期把日志同时写文件。IDEA 运行控制台的内容只在内存里，滚过去就找不回来，
  #   而"接口只返回 50000 系统繁忙"这类排查必须看到完整堆栈——写了文件就能直接 grep。
  #   路径相对各服务的工作目录（IDEA 里是模块根目录下的 logs/），已加进 .gitignore。
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
  level:
    com.yuedong: debug
