# ============================================================
# 悦动健身 · 中间件编排（部署到 CentOS VM）
# 用法：docker compose -f docker-compose.middleware.yml up -d
#
# 复用 mini-program 的镜像基础（mysql/redis/rabbitmq 延迟插件已内置），
# 新增 Nacos（注册中心）与 Kafka（埋点流，KRaft 单节点免 ZooKeeper）。
# ⚠️ KAFKA_ADVERTISED 必须改成 VM 的局域网 IP，否则本机 IDEA 连不上。
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: fitness-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建 5 个业务库并导入建表脚本（把 ../sql/*.sql 挂到这里）
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fitness-net]

  redis:
    image: redis:7
    container_name: fitness-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fitness-net]

  rabbitmq:
    # mini-program 自建镜像：已内置 rabbitmq_delayed_message_exchange 插件
    # （在 F:/生活工具小程序/rabbitmq 下 docker build -t lifetools-rabbitmq:3.13-delayed .）
    image: lifetools-rabbitmq:3.13-delayed
    container_name: fitness-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理台 http://VM_IP:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [fitness-net]

  nacos:
    image: nacos/nacos-server:v2.4.3-slim
    container_name: fitness-nacos
    environment:
      MODE: standalone            # 单机模式（演示够用；生产用集群+MySQL 存储）
      NACOS_AUTH_ENABLE: "false"  # 演示关闭鉴权
      TZ: Asia/Shanghai
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"               # gRPC 端口（客户端 2.x 必需，别漏）
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [fitness-net]

  kafka:
    image: apache/kafka:3.9.0
    container_name: fitness-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft 模式：单节点既是 broker 又是 controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED:-192.168.100.100}:9092  # ⚠️ 改成 VM IP
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"          # 演示环境自动建 topic
    networks: [fitness-net]

volumes:
  mysql-data:
  redis-data:

networks:
  fitness-net:
    driver: bridge
