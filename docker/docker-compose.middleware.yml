# ============================================================================
# 悦动健身 · 测试环境编排（中间件 + Nginx 接入层，部署到 CentOS VM，一条命令全起）
#
# 用法（在 VM 上，文件放 ~/fitness/docker/ 下，sql 目录要能对上）：
#   docker compose -f docker-compose.middleware.yml up -d          # 建 + 起 + 后台
#   docker compose -f docker-compose.middleware.yml ps             # 看健康状态
#   docker compose -f docker-compose.middleware.yml logs -f nacos  # 看某个容器日志
#   docker compose -f docker-compose.middleware.yml down           # 停并删容器（数据卷保留）
#
# 这个文件装的是"环境"：中间件 MySQL / Redis / RabbitMQ / Nacos / Kafka，加一个接入层 Nginx。
# 7 个业务服务（gateway 8080 + user/course/order/point/behavior/admin）仍在 Windows
# 的 IDEA 里跑 —— 现在还没有业务镜像，也没有 Dockerfile，属于后面单独一期再做。
# 六个容器之间互不依赖，所以不写 depends_on。
#
# ---------------------------------------------------------------------------
# ★ 必改参数一共两处：
#   1) 本文件的 VM_IP —— Kafka 的广播地址，写在同目录 .env 里（模板 .env.example）
#   2) nginx/nginx.conf 里 upstream 的 IP —— 你 Windows 的局域网 IP（网关在那儿跑）
#   其余参数都可以直接用默认值。
#   VM_IP 的改法两种，任选一种：
#   方式一（推荐）：用同目录的 .env 文件（模板是 .env.example，cp 一份改成自己的值）。
#                  compose 会自动读取，不用动本文件；四个可配项 VM_IP/DB_PASS/
#                  MQ_USER/MQ_PASS 的说明和坑都写在那两份文件里。
#                  ⚠️ 要先 cd 到本目录再 up：老版从当前目录找 .env，新版从 compose
#                  文件所在目录找，cd 过来两种都对。
#   方式二：直接改本文件里 `${VM_IP:-192.168.150.100}` 的默认值。
#   为什么 VM_IP 必须改：Kafka 会把"客户端该连哪个地址"告诉对方，容器里写 localhost
#   的话，Windows 上的 behavior 服务拿到地址后连的是自己 → 连不上。
#
# ★ 铁律：每一个 image 都必须和 VM 上 docker images 里的 tag 逐字符一致。
#   这台 VM 连不上 Docker Hub（实测 dial tcp ...:443: connect: connection refused），
#   而 compose 遇到本地没有的名字就会当成 docker.io/library/xxx 去拉 —— 一定失败。
#   所以本地已有镜像的【名字】是唯一的保险；想用新镜像就推到你自己的 ACR、再用全名。
#   注意 mysql:8.0 只有本地 tag、ACR 上没有它的记录，VM 重做后要留意。
#   当前 6 个 image（全部已核对存在）：
#     mysql:8.0 / redis:7.4 / nacos-server:v2.4.3 /
#     rabbitmq:3.13-management / kafka:3.9.2 / nginx:1.27-alpine
#   ACR 全名前缀（同一个镜像）：
#     crpi-2gz9tuyd1xcuucrl.cn-hangzhou.personal.cr.aliyuncs.com/li_yu_xuan/
#   另外 VM 上还有 sentinel-dashboard:1.8.10，但代码里零引用，所以这里不放它。
#
# ⚠️ 两个 tag 是"本地改过名"的，别被版本号骗了：
#   nacos-server:v2.4.3 与 ACR 的 nacos-server:v2.5.4 镜像 ID 相同（cedf09a98a79）；
#   nginx:1.27-alpine 与 ACR 的 nginx:1.28-alpine 镜像 ID 相同（0dcc88822d45）。
#   想知道 Nacos 到底是什么版本（决定控制台是 8848 还是 3.x 的独立 8080 端口），
#   别猜：docker logs fitness-nacos 2>&1 | head -20 看启动行，或看控制台页脚版本号。
#
#
# ★ 为什么这里没有 Sentinel：代码里目前零引用（所有 pom.xml 和 application.yml 都搜不到
#   sentinel），加了就是个空跑的容器 —— 虽然镜像你已经有了（sentinel-dashboard:1.8.10），
#   缺的是代码那边的依赖，不是镜像。按设计文档 D13/4.6，限流属于第 5 期，
#   到时候要一起加三样：gateway 的两个依赖、规则持久化到 Nacos、dashboard 容器
#   （dashboard 必须 -Dserver.port=8858，它默认 8080，会和网关抢端口）。
#   那一期的 image 行直接写本地已有的 sentinel-dashboard:1.8.10 就行。
#
# ★ Nginx 接入层：链路是「前端 → Nginx(VM:80) → 网关(8080) → 业务服务」，服务段已启用，
#   配置在同目录 nginx/nginx.conf（里面那个 Windows IP 是第 2 个必改项）。
#   现在只有 /api/ 转发是通的；两个前端仍是 Mock 数据、还没打 dist，
#   所以托管静态页的那两行 volumes 先注释着 —— 打开它们但目录不存在时，
#   Docker 会建个空目录顶替配置文件，nginx 会直接启动失败，别提前打开。
#   开发期想绕过 Nginx 也行：vite 的 dev proxy 已直连 8080，但请求路径要保持相对的
#   /api/xxx，将来切到 Nginx 才不用改前端代码。
#
# ---------------------------------------------------------------------------
# 内存预算（按 VM 只给 6G 算，8G 也照这份配、不必改）
#   mysql  700m   （InnoDB buffer pool 压到 256M，够跑 7 个库）
#   redis  300m   （maxmemory 256mb）
#   rabbit 512m   （内存高水位 400M）
#   nacos  700m   （堆显式压到 512m；之前实测不设时是 1g，小 VM 上就是它先撑爆的）
#   kafka  768m   （堆 512m）
#   nginx   64m   （很轻）
#   合计 ≈ 3.1G，剩下 2.9G 给 Docker 自身、内核和文件缓存。
#   ⚠️ 别把 VM 开到 8G：宿主机 Windows 本来就只剩一点空闲，VM 越大越卡。
#
# ---------------------------------------------------------------------------
# 后端（IDEA 运行配置）要配套的环境变量，VM_IP 换成你的 VM 地址：
#   DB_HOST=VM_IP  DB_PORT=3306  DB_USER=root  DB_PASS=123456
#   NACOS_ADDR=VM_IP:8848
#   REDIS_HOST=VM_IP        # course/point/behavior 用这个
#   REDIS_ADDR=VM_IP        # gateway/user 用这个（两份 yml 键名不统一，两个都得给）
#   MQ_HOST=VM_IP  MQ_USER=fitness  MQ_PASS=fitness123   # 见下面 rabbitmq 的警告
#   KAFKA_ADDR=VM_IP:9092
#   TOKEN_CHECK=true        # 想跳过登录鉴权先调接口时设 false
# 服务注册问题备忘：后端在 Windows 上注册到 Nacos 的实例 IP 是你 Windows 的局域网 IP，
# 所以 VM 和 Windows 必须双向可达（VMware NAT 通常宿主机→VM 通、VM→宿主机也通）。
# 若服务之间调不通，给服务再加 SPRING_CLOUD_NACOS_DISCOVERY_IP=你的Windows IP。
#
# ---------------------------------------------------------------------------
# 起来之后的验证清单（都在 Windows 上做，不用登 VM）：
#   1. docker compose ... ps                五个中间件是 Up (healthy)，
#      Nginx 没配健康检查（它很轻，直接按第 7 步访问验证更靠谱），显示 Up 就行
#   2. http://VM_IP:8848/nacos              服务列表；先空着正常，后端启动后才有实例
#   3. http://VM_IP:15672                   用 fitness/fitness123 登录；
#      Administration → Features 里要能看到 delayed message exchange（没有就是插件丢了）
#   4. 数据库客户端连 VM_IP:3306            应看到 yd_user/yd_course/yd_order/
#      yd_point/yd_behavior/yd_admin/yd_community 七个库；少一个就是 SQL 没导入成功
#   5. docker exec -it fitness-mysql mysql -uroot -p123456 -e "show databases;"
#   6. 先起 course 再起 order，Nacos 里出现两个实例后，用 gateway 走一次登录 + 列表，
#      通了说明"中间件 + 服务 + 注册发现"这条链路完整。
#   7. 走 Nginx 的那一段：浏览器开 http://VM_IP/api/course/list
#      （这是白名单里的游客接口，不用登录就有 JSON）
#        出 JSON        → 前端 → Nginx → 网关 → course 整条通了
#        502 Bad Gateway → Nginx 本身没问题，是 nginx.conf 里的 Windows IP 不对，或网关没起
#        404            → 请求没进 /api 规则，检查你访问的路径是不是以 /api/ 开头
# ============================================================================
# ============================================================================
# ★★ 相对路径必须搞清，否则下面这些坑必踩 ★★
# 本文件里的 ./nginx/... 和 ../sql 这类相对路径，是按【你敲 docker compose 时所在的
# 目录】解析的，不是按 compose 文件自己所在的目录。所以永远先 cd 到本文件所在目录
# 再执行 up/ps/logs，不然路径全歪。自查（config 只显示路径、不会真启动）：
#   docker compose -f docker-compose.middleware.yml config | grep -E 'source|target'
#   输出的 source 应该是 …/fitness/docker/nginx/nginx.conf 和 …/fitness/sql
#
# 路径写歪之后最坏的地方在于：Docker 发现宿主机上那个路径不存在，就【建一个空目录】
# 顶上去，而不是报错。于是
#   ../sql  → 挂进来一个空目录 → MySQL 空库启动，一个业务库都没有（只在第一次初始化
#             时发生，之后不会再补，最难回头发现）
#   ./nginx/nginx.conf → 建了个【目录】顶替配置文件 → 报
#             "mount … not a directory: Are you trying to mount a directory onto a file"
# 修法是删掉那个被误建的空目录、把真文件放到位（先 ls -A 确认里面确实是空的）。
# ============================================================================
services:

  # ==========================================================================
  # 1) MySQL 8.0 —— 6 个业务库，首次启动自动导入建表脚本
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: fitness-mysql
    restart: unless-stopped          # VM 重启后自动拉起；手动 stop 的不会被重启拉起来
    mem_limit: 700m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-123456}   # ← 想改口令改这里，或 .env 里给 DB_PASS
      TZ: Asia/Shanghai
      # 不写 MYSQL_DATABASE：6 个库由脚本内部的 CREATE DATABASE 自己建
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00              # 与 JDBC url 里的 serverTimezone 一致
      - --performance-schema=OFF                # 关性能模式采样，小内存机器上省 200M+
      - --innodb-buffer-pool-size=256M          # 默认 128M，测试环境够用，别调大
      - --max-connections=200                   # 默认 151；7 个服务 × Hikari 上限 10 = 70，
                                                # 再留出你客户端工具的一堆连接，200 有余量
      - --skip-log-bin                          # 8.0 默认开 binlog，单机用不上，省磁盘
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 建表脚本：../sql 是 01_yd_user.sql … 07_yd_community.sql，MySQL 按文件名字母序执行，
      # 数字前缀就是为这个加的（老脚本 increment_* 会排在建表前面，全新初始化必失败）。
      # ⚠️ 只在"数据卷是空的"时候执行一次。改过 SQL 要重导：
      #     docker compose -f docker-compose.middleware.yml down -v   # -v 连数据卷一起删
      #     docker compose -f docker-compose.middleware.yml up -d     # 空卷 → 重新导入
      #   down -v 会清掉库里的所有数据，测试环境可以接受。
      #   ⚠️ 相对路径要成立：VM 上也保持 sql/ 和 docker/ 平级的结构
      #     （~/fitness/sql + ~/fitness/docker/docker-compose.middleware.yml），
      #     或者把 ../sql 直接写成 VM 上的绝对路径。挂错目录的话 MySQL 会空库启动，
      #     表全没有，而且只在第一次初始化时发生，很难回头发现。
      - ../sql:/docker-entrypoint-initdb.d:ro
      # CentOS 上 SELinux 是 Enforcing，若上面这行报 permission denied，把 :ro 改成 :ro,z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASS:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s              # 首次导入 6 个库要一会儿，这段时间不算失败
    networks: [fitness-net]

  # ==========================================================================
  # 2) Redis 7 —— 缓存三件套 + 登录令牌白名单 + 幂等锁 + 签到/排行榜
  # ==========================================================================
  redis:
    image: redis:7.4                 # VM 上是 7.4，没有裸的 redis:7
    container_name: fitness-redis
    restart: unless-stopped
    mem_limit: 300m
    command:
      - redis-server
      - --appendonly
      - "yes"                        # 开 AOF，重启后白名单/积分数据不丢
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction                   # ★ 别用 allkeys-lru：LRU 会把登录令牌白名单和幂等锁
                                     #   当普通键淘汰掉，表现是"用着用着突然全掉线"。
                                     #   noeviction 是写满就报错，宁可报错也不要静默失效。
      # 测试环境不设密码。要给 Redis 加密码的话，取消下面两行注释，
      # 同时后端要加 SPRING_DATA_REDIS_PASSWORD=xxx（yml 里目前只有 gateway/user 读了 REDIS_PASS）
      # - --requirepass
      # - "123456"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fitness-net]

  # ==========================================================================
  # 3) RabbitMQ 3.13 + 延迟消息插件 —— 秒杀削峰 / 订单 15 分钟超时取消 / 站内通知
  # ==========================================================================
  rabbitmq:
    # VM 上没有那个自建镜像（lifetools-rabbitmq:3.13-delayed），只有官方的
    # rabbitmq:3.13-management，所以照实写它。
    # ⚠️⚠️ 但延迟插件必须实测确认 —— 这是本文件唯一还没落实的风险 ⚠️⚠️
    # 订单服务把 ex.order.delay 声明成 x-delayed-message 类型的交换机
    # （fitness-order/mq/RabbitConfig.java），缺插件时 order 一启动就报
    # unknown exchange type，后果是"15 分钟未支付自动取消"整条链路静默失效。
    # 官方 3.13 镜像到底带不带这个插件，网上说法不一致，别信任何人的记忆（包括我的）——
    # 容器起来后花十秒实测：
    #   docker exec fitness-rabbitmq rabbitmq-plugins list | grep -i delayed
    # 三种结果对应三种做法：
    #   [E*] → 已启用，什么都不用做（最理想）。
    #   [e ] → 插件在镜像里但没启用，一条命令搞定（节点正在跑，不用 --offline）：
    #          docker exec fitness-rabbitmq rabbitmq-plugins enable rabbitmq_delayed_message_exchange
    #          然后 docker restart fitness-rabbitmq，再查一次变成 [E*] 就对了。
    #   没有 → 镜像里真没有。别去下载 .ez（这机器连不上外网仓库），用你自己那套现成的：
    #          Windows 的 F:/生活工具小程序/rabbitmq 目录里就有 Dockerfile + .ez，
    #          lifetools-rabbitmq:3.13-delayed 那台就是这么 build 出来的。
    #          scp 上 VM → docker build -t lifetools-rabbitmq:3.13-delayed .
    #          → 把下面 image 行换成它 → docker compose -f ... up -d rabbitmq
    # 顺带纠正一条你刚才敲的命令：docker exec 要的是【容器名或容器 ID】，不是镜像名，
    # 而且那时容器还没起来，所以报 No such container。查镜像用：
    #   docker run --rm --entrypoint sh rabbitmq:3.13-management -c 'ls /opt/rabbitmq/plugins'
    image: rabbitmq:3.13-management
    container_name: fitness-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # ★ 故意不用 guest 账号：RabbitMQ 默认禁止 guest 从"非本机"登录，
      #   而你的后端跑在 Windows 上，连 VM 的 5672 属于远程连接 → 会被直接拒。
      #   这里建一个普通账号 fitness，后端 yml 里的默认值是 guest/guest，
      #   所以 course/order/point/user 四个服务必须显式加 MQ_USER / MQ_PASS。
      #   注意：这两个值只在"数据目录是空的"那次启动时生效（镜像的初始化脚本只跑一次）。
      #   想改口令得连 rabbitmq-data 卷一起删：docker compose ... down -v 再 up -d。
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-fitness}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASS:-fitness123}
      RABBITMQ_DEFAULT_VHOST: /                  # 后端没配 vhost，用的就是默认的 /
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 400M    # 到 400M 就阻塞生产者，护住整台 VM
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"                # 管理台 http://VM_IP:15672 （fitness / fitness123）
    volumes:
      # 这个卷存队列数据 + 已启用插件的记录 + 账号，必须挂；
      # 不挂的话每次重建容器都要重新 enable 插件、账号也会丢。
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [fitness-net]

  # ==========================================================================
  # 4) Nacos 2.4.3 —— 只用注册中心（不用配置中心），单机模式 + 内嵌 Derby 存储
  # ==========================================================================
  nacos:
    # 你 VM 上这个 tag 没有仓库前缀（本地 retag）。核对：docker images | grep nacos
    image: nacos-server:v2.4.3
    container_name: fitness-nacos
    restart: unless-stopped
    mem_limit: 700m
    environment:
      MODE: standalone                         # 单机；集群模式才需要 MODE=cluster
      JVM_XMS: 256m                            # ★ 三行 JVM 参数是本服务能否活下来的关键：
      JVM_XMX: 512m                            #   不设的话镜像默认给 2g，小 VM 会被 OOM 打死
      JVM_XMN: 128m                            #   新生代；跟着 XMX 一起缩，别留默认 1g
      NACOS_AUTH_ENABLE: "false"               # 演示环境关鉴权（后端 yml 也没传用户名密码，
                                               # 开了就是 403 user not found）
      PREFER_HOST_MODE: ip
      TZ: Asia/Shanghai
      # 只用注册中心 + 内嵌 Derby，不需要 MYSQL_SERVICE_* 那一串外接库参数。
      # 将来要接配置中心并持久化到 MySQL，再补 MODE=standalone + MYSQL_SERVICE_HOST 等。
    ports:
      - "8848:8848"                # HTTP + 控制台（2.4.x 控制台就在 8848 的 /nacos，
                                   # 不是 Nacos 3.x 那个独立 8080，别按 3.x 开）
      - "9848:9848"                # ★ gRPC：SDK 2.x 走 8848+1000，漏了它注册/订阅全失败
      - "9849:9849"                # gRPC 集群通信端口 8848+1001，单机用不到，但客户端会探测
    volumes:
      - nacos-data:/home/nacos/data       # 内嵌 Derby 存储的数据目录
      - nacos-logs:/home/nacos/logs       # 出问题时 first stop 就是看这里的日志
      # 万一 nacos 起不来、日志里是 Permission denied：把上面两行注释掉就行。
      # 本项目只用注册中心、不用配置中心，Nacos 里没有需要保住的数据
      #（服务是每次启动自己注册的）。
    healthcheck:
      # 用 curl 打就绪接口；若镜像里没有 curl（探针一直 unhealthy 但服务正常），
      # 把这行换成 ["CMD-SHELL", "nc -z 127.0.0.1 8848 || exit 1"]，或整段删掉。
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [fitness-net]

  # ==========================================================================
  # 5) Kafka 3.9（KRaft 单节点，免 ZooKeeper）—— 埋点事件流
  # ==========================================================================
  kafka:
    # VM 上的 tag 是 kafka:3.9.2（不带 apache/ 前缀），照它写。
    # ⚠️ 下面的参数名用的是官方 apache/kafka 那套 KAFKA_XXX_YYY 风格。
    #   如果这镜像其实是 bitnami 系（要 KAFKA_CFG_XXX 前缀），表现是"容器起来了但
    #   KRaft/监听器配置没生效"。核对：docker logs fitness-kafka 2>&1 | head -30
    image: kafka:3.9.2
    container_name: fitness-kafka
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "9092:9092"
    environment:
      # ★★ 本文件唯一必须改的参数：把 VM_IP 换成 VM 的真实局域网 IP（或同目录 .env 里给）★★
      #   自检：docker exec fitness-kafka hostname -i 之后，在 Windows 上
      #        telnet/ping 这个 IP 的 9092，不通就是这里没改对。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${VM_IP:-192.168.150.100}:9092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller   # KRaft：一个进程同时当 broker 和 controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # controller 就在同一个容器里，所以写 localhost:9093 是对的，不依赖上面的 VM_IP
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT   # 要和 ADVERTISED 里的监听器名一致
      KAFKA_HEAP_OPTS: -Xms256M -Xmx512M            # ★ 默认 1g，这里压一半
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1     # 单节点，副本数只能是 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0     # 省掉消费组再均衡的 3 秒等待
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"       # 允许自动建 topic（behavior 服务不建 topic）
      KAFKA_NUM_PARTITIONS: 1                       # 自动建的就是 1 分区。埋点用 deviceId 做 key
                                                    # 保证同设备有序，1 分区对测试环境正好
      TZ: Asia/Shanghai
      # 想手动建 3 分区的 topic（体验分区并行）：
      #   docker exec fitness-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 \
      #     --create --topic yd-behavior-event --partitions 3 --replication-factor 1
      # 注意：topic 已存在时这条命令会报错，先 --list 看一眼。
    # ⚠️ 这里故意不给 Kafka 挂数据卷：Kafka 的日志目录和 KRaft 元数据格式化路径要配套改
    #   （KAFKA_LOG_DIRS + 镜像 entrypoint 各有一套），挂错会出现 no metadata found 或
    #   permission denied，反而把一个能跑的东西弄坏了。测试环境不持久化的代价很小：
    #   容器重建 = 位点清零，behavior 服务的 consumer 没配 auto-offset-reset，
    #   默认 earliest 会把旧埋点重放一遍，功能不受影响。
    # 真要持久化时，把下面两行取消注释（并删掉上面那段说明）：
    #   environment 里加  KAFKA_LOG_DIRS: /var/lib/kafka/data
    #   volumes 里加      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 用 Kafka 自带脚本探活；镜像里脚本路径不同就把命令换成
      # ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"]
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 40s
    networks: [fitness-net]

  # 前端统一入口：浏览器/小程序 → Nginx(VM:80) → 网关(8080) → 业务服务
  # 配置文件在同目录 nginx/nginx.conf，里面还有一个必改项（网关所在的 Windows IP）。
  nginx:
    image: nginx:1.27-alpine         # VM 上已有（与 ACR 的 1.28-alpine 是同一个镜像 ID）
    container_name: fitness-nginx
    restart: unless-stopped
    mem_limit: 64m                   # Nginx 很轻，64M 足够
    ports:
      - "80:80"
      # - "443:443"                  # 上 https 时再打开，并把证书目录挂进来
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ⚠️ 下面两条先关着：../deploy/*/dist 现在还不存在。
      #   bind mount 遇到宿主机不存在的路径时，Docker 会在那个位置建一个【空目录】，
      #   结果不是"少个前端页面"，而是 nginx 拿到一个目录当配置文件、直接启动失败。
      #   等前端接上真实接口、npm run build 出 dist 之后再打开这两行。
      # - ../deploy/web/dist:/usr/share/nginx/web:ro      # fitness-web 打包产物
      # - ../deploy/admin/dist:/usr/share/nginx/admin:ro  # fitness-admin 打包产物
      # SELinux 报 permission denied 就在 :ro 后面加个逗号 z
    networks: [ fitness-net ]

# ============================================================================
# 数据卷：docker compose down 不会删它们，只有 down -v 才删
# ============================================================================
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:

networks:
  fitness-net:
    driver: bridge

# ============================================================================
# Nginx 接入层补充说明（服务段在上面的 services 里，配置在 nginx/nginx.conf）
#
# Nginx 在这条链上管三件网关不该管的事：
#   1. /api/ 开头的请求转给网关（现在就生效）；
#   2. 托管两个前端打包出来的静态文件（等前端接真接口、打开那两行 volumes 才生效）；
#   3. 以后上 https，证书在这里终止。
#
# 三个一定会碰上的点：
#   1. 走 Nginx 之后浏览器只访问 80 这一个源，跨域问题自然消失 —— 但前提是两个前端的
#      请求路径都写成相对路径 /api/xxx，别再自己拼 http://192.168.x.x:8080。
#      开发期用 vite 的 dev proxy 时也保持相对路径，将来切到 Nginx 才不用改代码。
#   2. 现在项目没用 WebSocket，所以不用配 Upgrade/Connection 头；以后加长连接推送要补。
#   3. 管理端本地上传（还没实现）落地后，图片 URL 那条路径也要在 nginx.conf 里补一条
#      location，或者干脆把上传目录挂进 Nginx 当静态资源服务。
#
# 改了 nginx.conf 之后不用重建容器：
#   docker exec fitness-nginx nginx -t        # 先语法自检
#   docker exec fitness-nginx nginx -s reload # 再热加载
# ============================================================================
