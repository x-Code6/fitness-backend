# ============================================================
# 悦动健身 · Nginx 接入层配置
# 这份文件被 docker-compose.middleware.yml 挂进容器的
# /etc/nginx/conf.d/default.conf（官方镜像默认就是 include 这个目录）。
#
# 链路：浏览器/小程序 → Nginx(VM:80) → 网关(8080) → 各业务服务
#
# ★ 本文件唯一要改的是下面 upstream 里的 IP —— 填你 Windows 的局域网 IP（ipconfig 看）。
#   等业务服务也容器化了，再换成容器名 fitness-gateway:8080（同网络内 DNS 能解析）。
#   这里刻意写 IP 而不是主机名：nginx 在加载配置时就要解析 upstream 里的名字，
#   解析失败它直接退出、容器起不来；写一个语法合法的 IP，哪怕网关还没启动，
#   nginx 也能正常起来，访问 /api 只是回 502，排查比"容器秒退"直观得多。
#
# 改完这份配置后不用重建容器：
#   docker exec fitness-nginx nginx -t          # 先语法自检，必须显示 ok / successful
#   docker exec fitness-nginx nginx -s reload   # 热加载
# ============================================================

upstream gateway {
    server 192.168.150.1:8080;      # ← 改成你 Windows 的局域网 IP
}

server {
    listen 80;
    server_name _;                  # 测试环境用 IP 直访，没有域名，下划线表示"任意都行"

    # ---------- 后端接口：一条规则就够 ----------
    # 网关七条路由的 Path 全部以 /api 开头（见 fitness-gateway/application.yml），
    # 所以这里不需要照着路由表抄七遍，转发到网关即可，具体给哪个服务由网关决定。
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 真实客户端 IP：埋点服务统计 UV 时靠它，否则所有事件的 IP 都是 Nginx 容器
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;     # 秒杀下单后要轮询结果，读取超时别设太短

        # 以后如果加了 WebSocket 推送，这两行是必须的（现在项目里没用 WS，所以不放）：
        #   proxy_set_header Upgrade $http_upgrade;
        #   proxy_set_header Connection "upgrade";
    }

    # ---------- 前端静态页：现在会 404，属正常 ----------
    # 两个前端目前还是 Mock 数据，compose 里对应的两条 dist 挂载也还是注释状态，
    # 容器里没有 /usr/share/nginx/web 这个目录，所以下面两个 location 找不到文件。
    # 等前端接上真实接口、npm run build 出 dist 之后：
    #   1. 打开 compose 里那两行 volumes 注释；
    #   2. 管理端要在 vite.config.js 里配 base: '/admin/'，打包出来的资源路径才配得上
    #      下面的 /admin/ 前缀，否则页面能出、js/css 全 404。
    # try_files 最后兜到 index.html 是给 history 路由用的：
    # 用户在 /admin/order 这种地址上按刷新，磁盘上没有这个文件，交回给前端路由处理。
    location /admin/ {
        root /usr/share/nginx;      # URI /admin/x → 磁盘 /usr/share/nginx/admin/x
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    location / {
        root /usr/share/nginx/web;  # root 写到底，URI /assets/x.js → web/assets/x.js
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
