# RabbitMQ 内存流控水位（本项目专用配置文件）
#
# ★为什么需要一个文件，而不是环境变量。
#   3.13 起，"RABBITMQ_ + 某个配置项名字"这类环境变量全部废弃，镜像的启动脚本一旦
#   检测到就报错退出，容器根本不起来：
#     error: RABBITMQ_VM_MEMORY_HIGH_WATERMARK is set but deprecated
#     error: deprecated environment variables detected
#   所以这类配置只能走配置文件。（RABBITMQ_DEFAULT_USER / PASS / VHOST 不受影响——
#   它们是这个 Docker 镜像自己的变量，不是配置项映射，仍然写在 compose 里。）
#
# ★为什么挂到 /etc/rabbitmq/conf.d/ 而不是覆盖 /etc/rabbitmq/rabbitmq.conf。
#   conf.d 是官方的"额外配置"目录，3.13 会自动加载里面的 *.conf，优先级高于 rabbitmq.conf；
#   而镜像第一次启动时要往这个目录写 10-default-user.conf（就是 compose 里那两个账号变量
#   的落地点）。直接覆盖 rabbitmq.conf 会和它抢同一个文件，挂成只读还会写失败。
#   文件名按字典序生效，所以这里用 30- 开头，不占 00/10 那些位置。
#
# ★为什么写绝对值而不是比例，以及为什么是 600MiB。
#   默认水位是"总内存 × 0.4"，而 RabbitMQ 在容器里不一定读得到 compose 的
#   mem_limit 这个 cgroup 限额，可能按整台 VM 的内存算出远高于容器上限的水位——
#   真到那个点之前 Docker 就先 OOM Kill 了，表现是容器反复重启、日志里只有一句 killed。
#   2026-10-15 在这台 VM 上的实测：这个 broker <b>空跑</b>（零队列、零消息）RSS 就 268~344MiB，
#   因为管理台和 prometheus 两个插件本身就吃百来兆。所以最早那版写的 256MiB 是错的——
#   水位贴着实际用量，来一点消息就会触发内存告警、把生产者阻塞住
#   （症状是"发消息卡住不动"，而不是报错，很难往这里想）。
#   现在配合 mem_limit: 900m 把水位定在 600MiB：离容器上限还有 300MiB 余量，
#   离空跑用量有 250MiB 余量。核对：
#     docker exec rabbitmq rabbitmqctl status | grep -i "high watermark setting"
#     docker exec rabbitmq rabbitmq-diagnostics alarms        # 要说 no alarms
vm_memory_high_watermark.absolute = 600MiB
