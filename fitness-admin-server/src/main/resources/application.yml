# 管理端后端服务配置
# 中间件地址、账号、口令与密钥全部由环境变量注入，本文件不留任何默认值。
# 变量清单见项目根目录 .env.example；本地开发复制成 .env 即可，.env 不入库。
server:
  port: 8107

spring:
  # 环境相关配置（地址 / 账号 / 口令 / 密钥）一律由环境变量注入，本文件不留任何默认值。
  # 取值清单与说明见项目根目录 .env.example；本地开发把 .env.example 复制成 .env 即可。
  # 两种启动方式都能读到：IDEA 里工作目录是模块根目录（走 ../.env），
  # 在项目根目录跑 fat-jar 时走 ./.env。
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: fitness-admin-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/yd_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
  # multipart 上限。图片上传已迁到 fitness-file（那边自己配 2MB/4MB），
  # 这里保留同一组上限，供管理端后续可能新增的表单文件接口复用，
  # 避免容器层落回 Spring 默认值（1MB/10MB）时行为不一致。
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB      # 一次只传一个文件，留一倍余量给表单其他字段

# ★file.upload-root 已删除：上传目录现在只归 fitness-file 所有。
#   管理端再保留一份同名配置，会出现"改了这里却没生效"的假配置。

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 管理端 JWT（独立于用户端 secret）
admin-jwt:
  secret: ${ADMIN_JWT_SECRET}
  expire-minutes: 720        # 12 小时

logging:
  # ★联调期把日志同时写文件。IDEA 运行控制台的内容只在内存里，滚过去就找不回来，
  #   而"接口只返回 50000 系统繁忙"这类排查必须看到完整堆栈——写了文件就能直接 grep。
  #   路径相对各服务的工作目录（IDEA 里是模块根目录下的 logs/），已加进 .gitignore。
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
  level:
    com.yuedong: debug
