# 管理端后端服务配置
server:
  port: 8107

spring:
  application:
    name: fitness-admin-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/yd_admin?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 管理端 JWT（独立于用户端 secret）
admin-jwt:
  secret: ${ADMIN_JWT_SECRET:yuedong-admin-jwt-secret-2026-change-me-32bytes}
  expire-minutes: 720        # 12 小时

logging:
  level:
    com.yuedong: debug
