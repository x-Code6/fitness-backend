# 管理端后端服务配置
server:
  port: 8107

spring:
  application:
    name: fitness-admin-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/yd_admin?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  # multipart 上限（D19 图片上传）
  # ★这一层和 FileStorageService 里的 2MB 判断是两层，必须同时存在且容器层 ≥ 业务层：
  #   只有容器层的话，超限请求抛 MaxUploadSizeExceededException，用户看到的是"系统繁忙"
  #   而不是"图片不能超过 2MB"；只有业务层的话，Spring 会先把整个请求体读完（大文件撑内存/磁盘）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB      # 一次只传一张，留一倍余量给表单其他字段

# 图片落盘配置（D19）
file:
  # 上传根目录。相对路径是相对于<b>进程启动目录</b>，不是项目目录——
  # 换启动方式（IDE / jar / 容器）就会落到不同地方，部署时用绝对路径覆盖
  upload-root: ${FILE_UPLOAD_ROOT:./uploads}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 管理端 JWT（独立于用户端 secret）
admin-jwt:
  secret: ${ADMIN_JWT_SECRET:yuedong-admin-jwt-secret-2026-change-me-32bytes}
  expire-minutes: 720        # 12 小时

logging:
  level:
    com.yuedong: debug
