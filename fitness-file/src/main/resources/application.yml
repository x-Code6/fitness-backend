# 文件服务配置（图片上传 + 本地磁盘静态读取）
# 中间件地址、账号、口令与密钥全部由环境变量注入，本文件不留任何默认值。
# 变量清单见项目根目录 .env.example；本地开发复制成 .env 即可，.env 不入库。
server:
  port: 8108

spring:
  # 环境相关配置（地址 / 账号 / 口令 / 密钥）一律由环境变量注入，本文件不留任何默认值。
  # 取值清单与说明见项目根目录 .env.example；本地开发把 .env.example 复制成 .env 即可。
  # 两种启动方式都能读到：IDEA 里工作目录是模块根目录（走 ../.env），
  # 在项目根目录跑 fat-jar 时走 ./.env。
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: fitness-file
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/yd_file?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
  # multipart 上限：容器层必须 ≥ 业务层的 2MB
  # ★只有业务层判断的话，Spring 会先把整个请求体读完（大文件撑内存/磁盘）；
  #   只有容器层的话，超限抛 MaxUploadSizeExceededException，用户看到的是"系统繁忙"
  #   而不是"图片不能超过 2MB"。两层同时存在，提示才准确、资源才安全
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB      # 一次只传一张，留一倍余量给表单其他字段

# 图片落盘配置
file:
  # 上传根目录。相对路径是相对于<b>进程启动目录</b>，不是项目目录——
  # 换启动方式（IDE / jar / 容器）就会落到不同地方，部署时用绝对路径覆盖
  upload-root: ${FILE_UPLOAD_ROOT:./uploads}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 管理端 JWT 验签密钥：必须与 fitness-admin-server 的 admin-jwt.secret 完全一致
# ★只用于验签，不签发；文件服务不查 admin 表，验签通过即认可管理员身份
admin-jwt:
  secret: ${ADMIN_JWT_SECRET}

logging:
  # 同时写文件：上传失败（磁盘满/权限/DB 异常）需要完整堆栈，控制台滚过去就找不回来
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
  level:
    com.yuedong: debug
