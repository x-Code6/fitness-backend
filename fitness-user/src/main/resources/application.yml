# 用户服务配置
server:
  port: 8101

spring:
  application:
    name: fitness-user
  rabbitmq:
    host: ${MQ_HOST:192.168.150.105}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:fitness}
    password: ${MQ_PASS:fitness123}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认值指向测试 VM；整套上 VM 后用环境变量覆盖（DB_HOST/DB_PASS 等），不必回改本文件
    url: jdbc:mysql://${DB_HOST:192.168.150.105}:${DB_PORT:3306}/yd_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  # Redis：登录令牌白名单（login:token:{jti} / login:user:{userId}）。
  # 签发方在这里，校验方在网关，两边连的是同一个 Redis，key 格式统一由
  # fitness-common 的 RedisKeyConstants 提供，不要在任一边自己拼字符串。
  data:
    redis:
      host: ${REDIS_HOST:192.168.150.105}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 2000ms
    # MongoDB：只存"每日身体记录"（body_record 集合）。
    # ★分开写 host/port/database 而不是拼一条 uri：和上面 Redis 的写法保持一致，
    #   换环境时只用改同名环境变量（MONGO_HOST），不用去动一串 URI 字符串。
    mongodb:
      host: ${MONGO_HOST:192.168.150.105}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:yd_profile}
      # ★这个键是坑：Spring Data MongoDB 默认<b>不会</b>根据实体上的 @Indexed /
      #   @CompoundIndex 注解去建索引，注解写了也等于没写，唯一约束不生效。
      #   打开它之后，应用启动时会把实体上的索引声明同步到集合上（幂等，已存在就跳过）。
      #   代价是启动多几百毫秒；生产上更规范的做法是用脚本预先建好，本项目用注解图个直观。
      auto-index-creation: true
      # 一期不设账号：单机测试环境，且 MongoDB 默认不开鉴权。
      # 真要加就把 username/password 补上，同时在容器里初始化用户，两边必须一起改。
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.150.105:8848}

mybatis-plus:
  configuration:
    # 数据库下划线列名 ↔ 实体驼峰属性 自动映射
    map-underscore-to-camel-case: true
    # 开发期在控制台打印完整 SQL，方便排查；生产请删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 与网关一致的 JWT 配置
jwt:
  secret: ${JWT_SECRET:yuedong-fitness-jwt-secret-2026-please-change-me-32bytes}
  expire-minutes: 43200       # 30 天

logging:
  # ★联调期把日志同时写文件。IDEA 运行控制台的内容只在内存里，滚过去就找不回来，
  #   而"接口只返回 50000 系统繁忙"这类排查必须看到完整堆栈——写了文件就能直接 grep。
  #   路径相对各服务的工作目录（IDEA 里是模块根目录下的 logs/），已加进 .gitignore。
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
  level:
    com.yuedong: debug
