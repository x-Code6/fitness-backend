# 用户服务配置
server:
  port: 8101

spring:
  application:
    name: fitness-user
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASS:guest}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 编码期本机跑默认连 127.0.0.1；上 VM 后用环境变量覆盖（DB_HOST/DB_PASS）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/yd_user?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    # 数据库下划线列名 ↔ 实体驼峰属性 自动映射
    map-underscore-to-camel-case: true
    # 开发期在控制台打印完整 SQL，方便排查；生产请删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 与网关一致的 JWT 配置
jwt:
  secret: ${JWT_SECRET:yuedong-fitness-jwt-secret-2026-please-change-me-32bytes}
  expire-minutes: 43200       # 30 天

logging:
  level:
    com.yuedong: debug
