# 订单服务配置
# 中间件全在测试 VM（192.168.150.105）上跑，所以下面 ${} 的默认值就是 VM 的地址。
# ★要换地址就给进程设环境变量（DB_HOST / REDIS_HOST / MQ_HOST / NACOS_ADDR / KAFKA_ADDR），
#   别改这些默认值 —— 整套服务将来也上 VM 时会被同名变量覆盖，本文件不用回改。
server:
  port: 8103

spring:
  application:
    name: fitness-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:192.168.150.105}:${DB_PORT:3306}/yd_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  data:
    redis:
      host: ${REDIS_HOST:192.168.150.105}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${MQ_HOST:192.168.150.105}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:fitness}
    password: ${MQ_PASS:fitness123}
    # 生产者确认（publisher confirm）：消息到达交换机后回调，保证"秒杀扣了库存但消息没发出去"可感知
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费者手动 ack：业务成功才确认，异常可重试/进死信
        acknowledge-mode: manual
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.150.105:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# ---------- 评分排序参数（贝叶斯平滑）----------
# 公式：score = (bayes-c * bayes-m + 分数之和) / (bayes-c + 评价条数)
# ★这两个参数只在读取时用，分数本身不落库：
#   落库就等于把参数写死，调一次要刷全表。改这两个数就是调整"新店被往均值上收缩的强度"。
yd:
  rating:
    # C = 可信样本数。取 20 的含义：不到 20 条评价时分数明显被拽向 M，
    # 演示数据量下没有一家店能靠一两条五星冲上去
    bayes-c: 20
    # M = 全站先验均值（五分制）。演示环境写死；
    # 真实项目应由定时任务算出全站在评均值后回填，不要人拍一个数
    bayes-m: 4.5

logging:
  level:
    com.yuedong: debug
