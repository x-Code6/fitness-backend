# 订单服务配置
# 中间件地址、账号、口令与密钥全部由环境变量注入，本文件不留任何默认值。
# 变量清单见项目根目录 .env.example；本地开发复制成 .env 即可，.env 不入库。
server:
  port: 8103

spring:
  # 环境相关配置（地址 / 账号 / 口令 / 密钥）一律由环境变量注入，本文件不留任何默认值。
  # 取值清单与说明见项目根目录 .env.example；本地开发把 .env.example 复制成 .env 即可。
  # 两种启动方式都能读到：IDEA 里工作目录是模块根目录（走 ../.env），
  # 在项目根目录跑 fat-jar 时走 ./.env。
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: fitness-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/yd_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASS}
    # 生产者确认（publisher confirm）：消息到达交换机后回调，保证"秒杀扣了库存但消息没发出去"可感知
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费者手动 ack：业务成功才确认，异常可重试/进死信
        acknowledge-mode: manual
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# ---------- 评分排序参数（贝叶斯平滑）----------
# 公式：score = (bayes-c * bayes-m + 分数之和) / (bayes-c + 评价条数)
# ★这两个参数只在读取时用，分数本身不落库：
#   落库就等于把参数写死，调一次要刷全表。改这两个数就是调整"新店被往均值上收缩的强度"。
yd:
  rating:
    # C = 可信样本数。取 20 的含义：不到 20 条评价时分数明显被拽向 M，
    # 演示数据量下没有一家店能靠一两条五星冲上去
    bayes-c: 20
    # M = 全站先验均值（五分制）。演示环境写死；
    # 真实项目应由定时任务算出全站在评均值后回填，不要人拍一个数
    bayes-m: 4.5

logging:
  # ★联调期把日志同时写文件。IDEA 运行控制台的内容只在内存里，滚过去就找不回来，
  #   而"接口只返回 50000 系统繁忙"这类排查必须看到完整堆栈——写了文件就能直接 grep。
  #   路径相对各服务的工作目录（IDEA 里是模块根目录下的 logs/），已加进 .gitignore。
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
  level:
    com.yuedong: debug
