# 网关配置
server:
  port: 8080

spring:
  application:
    name: fitness-gateway
  cloud:
    nacos:
      discovery:
        # 编码期本机跑：默认 127.0.0.1；部署 VM 后用环境变量 NACOS_ADDR 覆盖
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # CORS 统一在网关处理（各服务不再配置，避免重复头）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # 路由表：/api/<服务前缀>/** → lb://服务名（StripPrefix=1 去掉 /api 一级）
      # 服务内部控制器路径保持与前端 Mock 一致（如 /auth/login、/checkin/do）
      routes:
        - id: user
          uri: lb://fitness-user
          predicates:
            - Path=/api/auth/**,/api/user/**
          filters:
            - StripPrefix=1
        - id: course
          uri: lb://fitness-course
          predicates:
            - Path=/api/course/**,/api/video/**,/api/store/**
          filters:
            - StripPrefix=1
        - id: order
          uri: lb://fitness-order
          predicates:
            - Path=/api/booking/**,/api/seckill/**
          filters:
            - StripPrefix=1
        - id: point
          uri: lb://fitness-point
          predicates:
            - Path=/api/checkin/**,/api/rank/**,/api/point/**
          filters:
            - StripPrefix=1
        - id: behavior
          uri: lb://fitness-behavior
          predicates:
            - Path=/api/behavior/**
          filters:
            - StripPrefix=1
        - id: community
          uri: lb://fitness-community
          predicates:
            - Path=/api/community/**
          filters:
            - StripPrefix=1
        - id: admin
          uri: lb://fitness-admin-server
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

# 鉴权配置
auth:
  # 免登录白名单（前缀匹配）：登录/注册、浏览类只读接口（游客可看）、埋点上报、接口文档
  whitelist:
    - /api/auth/login
    - /api/user/register
    - /api/user/sms/send        # 后期验证码登录启用
    - /api/course/list
    - /api/course/detail
    - /api/seckill/list
    - /api/store/nearby
    - /api/video/list
    - /api/video/detail
    - /api/community/feed        # 社区 Feed 游客可浏览；发布/点赞/评论需登录
    - /api/behavior              # 埋点允许匿名（服务内用 deviceId 区分）
    - /api/admin/**              # 管理端自带鉴权（fitness-admin-server 拦截器校验自己的 JWT）
    - /**/v3/api-docs

# JWT：与 fitness-user 保持一致（生产放 Nacos 配置中心/环境变量）
jwt:
  secret: ${JWT_SECRET:yuedong-fitness-jwt-secret-2026-please-change-me-32bytes}
  expire-minutes: 43200         # 30 天

logging:
  level:
    com.yuedong: debug
