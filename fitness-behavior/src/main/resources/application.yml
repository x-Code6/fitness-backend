# 埋点服务配置
# 中间件地址、账号、口令与密钥全部由环境变量注入，本文件不留任何默认值。
# 变量清单见项目根目录 .env.example；本地开发复制成 .env 即可，.env 不入库。
server:
  port: 8106

spring:
  # 环境相关配置（地址 / 账号 / 口令 / 密钥）一律由环境变量注入，本文件不留任何默认值。
  # 取值清单与说明见项目根目录 .env.example；本地开发把 .env.example 复制成 .env 即可。
  # 两种启动方式都能读到：IDEA 里工作目录是模块根目录（走 ../.env），
  # 在项目根目录跑 fat-jar 时走 ./.env。
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: fitness-behavior
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/yd_behavior?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_ADDR}
    producer:
      # key=deviceId 序列化：保证同一设备的事件进入同一分区、按序消费
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: yd-behavior-consumer
      # ★键名必须是 key-deserializer / value-deserializer。
      #   这里以前写的是 key-serializer/value-serializer —— 那是<b>生产端</b>的属性名，
      #   放在 consumer 节点下 Spring Boot 会当成未知属性直接忽略，
      #   于是"看起来配了、实际用的是默认值"。默认值刚好也是 String 反序列化器所以没出事，
      #   但这类"配置写了不生效"是排查成本最高的一类错：日志不报、行为不变、只有换实现时才炸
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # ★手动 ack：消费者方法里的 Acknowledgment 才有意义。
      #   落库成功/确认重复才 ack；失败交给 DefaultErrorHandler 重试，仍失败进 DLT。
      ack-mode: manual_immediate
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

logging:
  # ★联调期把日志同时写文件。IDEA 运行控制台的内容只在内存里，滚过去就找不回来，
  #   而"接口只返回 50000 系统繁忙"这类排查必须看到完整堆栈——写了文件就能直接 grep。
  #   路径相对各服务的工作目录（IDEA 里是模块根目录下的 logs/），已加进 .gitignore。
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
  level:
    com.yuedong: debug
