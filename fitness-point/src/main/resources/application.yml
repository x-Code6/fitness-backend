# 积分服务配置
# 中间件全在测试 VM（192.168.150.105）上跑，所以下面 ${} 的默认值就是 VM 的地址。
# ★要换地址就给进程设环境变量（DB_HOST / REDIS_HOST / MQ_HOST / NACOS_ADDR / KAFKA_ADDR），
#   别改这些默认值 —— 整套服务将来也上 VM 时会被同名变量覆盖，本文件不用回改。
server:
  port: 8104

spring:
  application:
    name: fitness-point
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:192.168.150.105}:${DB_PORT:3306}/yd_point?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  data:
    redis:
      host: ${REDIS_HOST:192.168.150.105}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${MQ_HOST:192.168.150.105}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:fitness}
    password: ${MQ_PASS:fitness123}
    listener:
      simple:
        # 消费者手动 ack：处理成功才确认，异常可重试/进死信（第⑤步详解）
        acknowledge-mode: manual
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.150.105:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

logging:
  level:
    com.yuedong: debug
